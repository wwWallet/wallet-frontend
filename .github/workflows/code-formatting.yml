# This name is shown in status badges
name: code-formatting

on:
  push:
    branches:
      - master
  pull_request:
    branches-ignore:
      - 'tmp**'

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs; let every master run finish
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  editorconfig:
    name: Check EditorConfig compliance

    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up editorconfig-checker
        uses: editorconfig-checker/action-editorconfig-checker@v3.0.0
        with:
          version: v4.0.2

      - name: Check code formatting
        run: editorconfig-checker -no-color

  prettier-eslint:
    name: Check Prettier and ESLint
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        env:
          YARN_NETWORK_CONCURRENCY: '1'
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Check Prettier formatting
        run: yarn format:check

      - name: Check ESLint rules
        run: yarn lint
