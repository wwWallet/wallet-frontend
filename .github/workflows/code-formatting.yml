# This name is shown in status badges
name: code-formatting

on:
  push:
    branches:
      - master
  pull_request:
    branches-ignore:
      - 'tmp**'

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs; let every master run finish
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  editorconfig:
    name: Check EditorConfig compliance

    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up editorconfig-checker
        uses: editorconfig-checker/action-editorconfig-checker@v3.0.0
        with:
          version: v4.0.2

      - name: Check code formatting
        run: editorconfig-checker -no-color
