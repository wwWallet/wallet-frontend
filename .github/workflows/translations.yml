name: translation-check

permissions:
  contents: read

on:
  pull_request:
    branches-ignore:
      - 'tmp**'

jobs:
  check-translations:
    name: Check translation coverage

    runs-on: ubuntu-22.04

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Verify translations
        run: |
          npm run translations

          if ! git diff --quiet -- src/locales translation_coverage ||
              test -n "$(git ls-files --others --exclude-standard -- src/locales translation_coverage)"; then
            echo "::error::Generated translation files are out of date."
            echo "Run 'npm run translations' locally and commit the resulting changes."
            git status --short -- src/locales translation_coverage
            git diff -- src/locales translation_coverage
            exit 1
          fi
