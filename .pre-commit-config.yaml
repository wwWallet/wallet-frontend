repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
        name: Minor auto-fixes
        exclude: (^|/)(node_modules|dist|build|coverage|\.nyc_output|test-results|playwright-report)/|(^|/)\.DS_Store$|^public/|^src/locales/[^/]+\.json$

  - repo: local
    hooks:
      - id: translations
        name: Maintain translations
        language: system
        entry: bash -c 'npm run translations && git add -- src/locales translation_coverage'
        pass_filenames: false
        always_run: true

  - repo: https://github.com/editorconfig-checker/editorconfig-checker
    rev: v4.0.2
    hooks:
      - id: editorconfig-checker
        name: Check .editorconfig rules
        args: ["-no-color"]
        types_or: [text]
